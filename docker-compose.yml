# Sobe PostgreSQL + API localmente:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odr
      POSTGRES_USER: odr
      POSTGRES_PASSWORD: odr
    ports:
      - "5432:5432"
    volumes:
      - odr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odr -d odr"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/odr
      DB_USER: odr
      DB_PASSWORD: odr
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  odr-pgdata:
