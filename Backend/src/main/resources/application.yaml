spring:
  application:
    name: odr-backend
  profiles:
    # Em hospedagem, defina SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é gerenciado pelo Flyway (db/migration); o Hibernate só valida.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Plataformas de hospedagem (Render, Railway, Heroku...) injetam PORT.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # Lista separada por vírgula. Ex.: https://meu-front.com,http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
